<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA 即時提問牆</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #07070d;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 頂部 ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid #1a1a28;
    flex-shrink: 0;
    background: rgba(7,7,13,0.95);
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,111,176,0.1);
    border: 1px solid rgba(255,111,176,0.25);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 12px; color: #ff6fb0; font-weight: 700; letter-spacing: 0.08em;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff6fb0; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .topbar h1 { font-size: 20px; font-weight: 900; }
  .q-count-badge {
    background: #13131e; border: 1px solid #1e1e30;
    border-radius: 100px; padding: 6px 16px;
    font-size: 14px; color: #5a5a7a;
  }

  /* ── 切換按鈕 ── */
  .view-btns {
    display: flex; gap: 4px;
    background: #13131e; border: 1px solid #1e1e30;
    border-radius: 10px; padding: 3px;
  }
  .view-btn {
    padding: 7px 18px; border: none; background: transparent;
    color: #5a5a7a; border-radius: 8px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .view-btn.active { background: #ff6fb0; color: white; font-weight: 700; box-shadow: 0 0 16px rgba(255,111,176,0.3); }

  /* ── 主區域 ── */
  .main { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: #2e2e42; border-radius: 2px; }

  /* ── 卡片列表 ── */
  .questions-list { display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto; }

  .q-card {
    background: #10101a;
    border: 1px solid #1e1e30;
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    transition: all 0.3s;
    animation: slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    position: relative;
    overflow: hidden;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .q-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #ff6fb0, #7c6fff);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .q-card.top-voted { border-color: rgba(255,111,176,0.3); background: rgba(255,111,176,0.04); }
  .q-card.top-voted::before { opacity: 1; }

  /* 投票區 */
  .vote-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 52px;
  }

  .vote-btn {
    width: 44px; height: 44px;
    background: #1a1a28;
    border: 1.5px solid #2e2e42;
    border-radius: 10px;
    color: #7a7a9a;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .vote-btn:hover { border-color: #ff6fb0; color: #ff6fb0; background: rgba(255,111,176,0.08); }
  .vote-btn.voted { background: rgba(255,111,176,0.15); border-color: #ff6fb0; color: #ff6fb0; }

  .vote-count {
    font-size: 20px; font-weight: 900;
    color: #e8e8f0;
    line-height: 1;
  }
  .vote-count.has-votes { color: #ff6fb0; }

  /* 問題內容 */
  .q-content { flex: 1; min-width: 0; }
  .q-text {
    font-size: 20px; font-weight: 700;
    line-height: 1.6; color: #e8e8f0;
    margin-bottom: 10px;
    word-break: break-all;
  }
  .q-meta {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: #4a4a6a;
  }
  .q-name { display: flex; align-items: center; gap: 5px; }
  .q-time { margin-left: auto; }

  /* NEW 徽章 */
  .new-badge {
    background: rgba(124,111,255,0.15);
    border: 1px solid rgba(124,111,255,0.3);
    color: #7c6fff;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 100px;
    letter-spacing: 0.1em;
  }

  /* 空狀態 */
  .empty {
    text-align: center; padding: 80px 24px;
    color: #3a3a52;
  }
  .empty svg { width: 56px; height: 56px; margin-bottom: 16px; opacity: 0.3; }
  .empty p { font-size: 18px; }

  /* 狀態列 */
  .statusbar {
    padding: 6px 32px;
    background: #0a0a12;
    border-top: 1px solid #1a1a28;
    font-size: 11px; color: #3a3a52;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #7c6fff; opacity: 0.5; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="live-badge"><div class="live-dot"></div>LIVE Q&A</div>
    <h1>現場提問</h1>
    <div class="q-count-badge" id="q-count">0 則問題</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center;">
    <div class="view-btns">
      <button class="view-btn active" id="btn-new" onclick="setSort('new')">最新</button>
      <button class="view-btn" id="btn-votes" onclick="setSort('votes')">最多讚</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="questions-list" id="q-list">
    <div class="empty" id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
      </svg>
      <p>等待第一則問題...</p>
    </div>
  </div>
</div>

<div class="statusbar">
  <div class="status-dot"></div>
  <span id="status-text">連線中...</span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ⚠️ 換成你的 Firebase 設定
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "YOUR_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let allQuestions = [];
  let sortMode = 'new';
  let votedIds = new Set(JSON.parse(localStorage.getItem('qa_voted') || '[]'));

  window.setSort = function(mode) {
    sortMode = mode;
    document.getElementById('btn-new').classList.toggle('active', mode === 'new');
    document.getElementById('btn-votes').classList.toggle('active', mode === 'votes');
    render();
  }

  // 監聽問題
  onValue(ref(db, 'questions'), snap => {
    allQuestions = [];
    if (snap.exists()) {
      snap.forEach(child => {
        allQuestions.push({ id: child.key, ...child.val() });
      });
    }
    document.getElementById('q-count').textContent = allQuestions.length + ' 則問題';
    document.getElementById('status-text').textContent = '上次更新：' + new Date().toLocaleTimeString('zh-TW');
    render();
  });

  function render() {
    const list = document.getElementById('q-list');
    const empty = document.getElementById('empty-state');

    if (allQuestions.length === 0) {
      empty.style.display = 'block';
      list.querySelectorAll('.q-card').forEach(el => el.remove());
      return;
    }
    empty.style.display = 'none';

    // 排序
    const sorted = [...allQuestions].sort((a, b) => {
      if (sortMode === 'votes') return (b.votes || 0) - (a.votes || 0);
      return (b.ts || 0) - (a.ts || 0);
    });

    const maxVotes = Math.max(...sorted.map(q => q.votes || 0), 1);

    // diff render
    const existing = {};
    list.querySelectorAll('.q-card').forEach(el => { existing[el.dataset.id] = el; });
    const newIds = new Set(sorted.map(q => q.id));

    // 移除已刪除
    Object.keys(existing).forEach(id => {
      if (!newIds.has(id)) existing[id].remove();
    });

    // 插入或更新，按照排序順序
    sorted.forEach((q, idx) => {
      const isTop = (q.votes || 0) >= maxVotes && maxVotes > 0;
      const isNew = Date.now() - (q.ts || 0) < 30000;
      const isVoted = votedIds.has(q.id);
      const timeStr = formatTime(q.ts);

      if (existing[q.id]) {
        // 更新
        const el = existing[q.id];
        el.querySelector('.vote-count').textContent = q.votes || 0;
        el.querySelector('.vote-count').className = 'vote-count' + ((q.votes || 0) > 0 ? ' has-votes' : '');
        el.querySelector('.vote-btn').className = 'vote-btn' + (isVoted ? ' voted' : '');
        el.classList.toggle('top-voted', isTop);
        // 重排順序
        list.appendChild(el);
      } else {
        // 新增卡片
        const el = document.createElement('div');
        el.className = 'q-card' + (isTop ? ' top-voted' : '');
        el.dataset.id = q.id;
        el.innerHTML = `
          <div class="vote-area">
            <button class="vote-btn${isVoted ? ' voted' : ''}" title="為這個問題按讚">
              <span>👍</span>
            </button>
            <div class="vote-count${(q.votes||0)>0?' has-votes':''}">${q.votes || 0}</div>
          </div>
          <div class="q-content">
            <div class="q-text">${escHtml(q.text)}</div>
            <div class="q-meta">
              <span class="q-name">
                <span>${q.name === '匿名' ? '👤' : '🙋'}</span>
                <span>${escHtml(q.name || '匿名')}</span>
              </span>
              ${isNew ? '<span class="new-badge">NEW</span>' : ''}
              <span class="q-time">${timeStr}</span>
            </div>
          </div>`;

        el.querySelector('.vote-btn').addEventListener('click', () => vote(q.id, el));
        list.appendChild(el);
      }
    });
  }

  function vote(id, el) {
    if (votedIds.has(id)) return;
    votedIds.add(id);
    localStorage.setItem('qa_voted', JSON.stringify([...votedIds]));
    el.querySelector('.vote-btn').classList.add('voted');

    runTransaction(ref(db, 'questions/' + id + '/votes'), cur => (cur || 0) + 1);
  }

  function formatTime(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    if (diff < 60000) return '剛剛';
    if (diff < 3600000) return Math.floor(diff/60000) + ' 分鐘前';
    return new Date(ts).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
